name: Sync Database Diário

on:
  schedule:
    - cron: '0 3 * * *' # Roda todo dia às 03:00 UTC (Meia-noite BRT)
  workflow_dispatch: # Permite rodar manualmente

# ESTA É A PARTE QUE CORRIGE O ERRO 403
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3
        with:
          # Garante que o token usado no checkout tenha permissões de escrita
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install pandas pyarrow fastparquet requests

      - name: Rodar script de verificação
        run: python scripts/verifica-base.py

      - name: Commitar e dar Push nos arquivos gerados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add complementos/*.csv
          # O comando abaixo evita erros se não houver nada novo para commitar
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update complementos [skip ci]" && git push)