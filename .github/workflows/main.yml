name: Sync Database Diário

on:
  schedule:
    - cron: '0 3 * * *' # Roda todo dia às 03:00 UTC (Meia-noite BRT)
  workflow_dispatch: # Permite rodar manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install pandas pyarrow fastparquet requests

      - name: Rodar script de verificação
        run: python scripts/verifica-base.py

      - name: Commitar e dar Push nos arquivos gerados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Cria a pasta ops se ela não existir
          mkdir -p ops
          
          # Força o rastreio da pasta ops ignorando o .gitignore do seu PC
          git add -f ops/
          
          # Só commita se houver mudanças reais
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ops [skip ci]" && git push)